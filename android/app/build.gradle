plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infones.app'
    compileSdk 34
    ndkVersion '25.2.9519653'   // 固定 NDK 版本，保证 CI 与本地一致

    defaultConfig {
        applicationId "com.infones.app"
        minSdk 26          // AAudio 需要 API 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // 64 位 arm 为主，保留 32 位 arm 兼容低端机；x86_64 供模拟器调试
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

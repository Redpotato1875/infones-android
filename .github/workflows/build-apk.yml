name: Build APK

# 推送到 main / 打 v* tag / 手动触发时，在 GitHub 云端编译出 APK。
# 无需本机装 NDK/SDK，构建产物作为 artifact 供下载（约 5~10 分钟）。
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK（/usr/local/lib/android/sdk）。
      # 不使用 android-actions/setup-android：该 action 会默认安装已废弃的
      # 'tools' 包，在 cmdline-tools 16.0 上报 "Failed to find package 'tools'"；
      # 其 packages 多行输入也会被当成单个包名。这里直接调用 sdkmanager。
      - name: 安装 Android SDK / NDK / CMake
        run: |
          set -e
          SDK=/usr/local/lib/android/sdk
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then echo "找不到 sdkmanager"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"
          if ! "$SDKM" --sdk_root="$SDK" --install "ndk;25.2.9519653"; then
            echo "::error::NDK 25.2.9519653 不可用，当前可选版本："
            "$SDKM" --sdk_root="$SDK" --list 2>/dev/null | grep -i "ndk;" | head -30 || true
            exit 1
          fi
          "$SDKM" --sdk_root="$SDK" --list_installed 2>/dev/null | grep -E "ndk;|cmake;|platforms;android-34|build-tools;34" || true

      - name: 安装 Gradle 8.7
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version | head -8

      - name: 编译 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: infones-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 编译 release APK（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 上传 release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: infones-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
